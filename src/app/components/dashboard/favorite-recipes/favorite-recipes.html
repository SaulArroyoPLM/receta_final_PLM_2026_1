<mat-accordion class="fav-accordion">
  <mat-expansion-panel
    class="fav-panel"
    [expanded]="panelOpenState()"
    (opened)="panelOpenState.set(true)"
    (closed)="panelOpenState.set(false)"
  >
    <mat-expansion-panel-header class="fav-panel-header">
      <mat-panel-title class="fav-title"> Recetas favoritas </mat-panel-title>

      <button type="button" class="btn-ver-todas" (click)="$event.stopPropagation()">
        Ver todas
      </button>
    </mat-expansion-panel-header>

    <div class="fav-divider"></div>

    <ul class="fav-list">
      @for (r of recetas; track r.id) {
        <li class="fav-item">
          <mat-icon class="fav-icon">note_add</mat-icon>
          <span class="fav-name">{{ r.nombre }}</span>

          <button type="button" class="btn-action btn-edit" title="Usar receta">
            <mat-icon>edit</mat-icon>
          </button>
          <button
            type="button"
            class="btn-action btn-delete"
            title="Eliminar receta"
            (click)="onEliminar(r)"
          >
            <mat-icon>delete_outline</mat-icon>
          </button>
        </li>
      } @empty {
        <li class="fav-empty">Aún no tienes recetas favoritas</li>
      }
    </ul>
  </mat-expansion-panel>
</mat-accordion>
