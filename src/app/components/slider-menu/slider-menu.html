<!-- Barra móvil (solo visible en pantallas pequeñas) -->
<header class="topbar d-lg-none d-flex align-items-center justify-content-between px-3 py-2 bg-white border-bottom">
  <button type="button" class="btn btn-link text-primary p-0 fs-3" (click)="toggle()" aria-label="Abrir menú">
    <i class="bi bi-list"></i>
  </button>
  <img src="assets/images/logoplmreceta.svg" alt="PLM Receta digital" height="42" />
  <a routerLink="/receta" class="btn btn-primary btn-sm rounded-pill d-flex align-items-center gap-1">
    <i class="bi bi-plus-lg"></i>
  </a>
</header>

@if (open()) {
<div class="backdrop d-lg-none" (click)="close()"></div>
}

<!-- Barra lateral (Desktop y Móvil abierto) -->
<aside class="sidebar d-flex flex-column" [class.open]="open()" [class.collapsed]="collapsed()">

  <!-- Encabezado con Logo y botón de colapsar -->
  <div class="sidebar-header d-flex align-items-center justify-content-between">
    <a routerLink="/home" class="logo-link" (click)="close()">
      <img src="assets/images/logoplmreceta.svg" alt="PLM Receta digital" class="logo-img" />
      <img src="assets/images/logo-mini.svg" alt="PLM" class="logo-mini" />
    </a>

    <!-- Desktop: colapsar / expandir -->
    <button type="button" class="toggle-btn d-none d-lg-flex" (click)="toggleCollapse()"
            [attr.aria-label]="collapsed() ? 'Expandir menú' : 'Colapsar menú'">
      <i class="bi" [class.bi-chevron-left]="!collapsed()" [class.bi-chevron-right]="collapsed()"></i>
    </button>

    <!-- Móvil: cerrar drawer -->
    <button type="button" class="toggle-btn d-lg-none" (click)="close()" aria-label="Cerrar menú">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <div class="sidebar-body flex-grow-1 overflow-auto">
    <!-- Botón Inicio destacado en azul -->
    <a routerLink="/home" routerLinkActive="active" class="btn-inicio" (click)="close()" title="Inicio">
      <i class="bi bi-house"></i>
      <span class="txt">Inicio</span>
    </a>

    <!-- Tarjeta Selector de Consultorio -->
    <div class="consultorio-box">
      <div class="consultorio-header">
        <span class="consultorio-title">Consultorio:</span>
        <div class="chevrons">
          <i class="bi bi-chevron-up"></i>
          <i class="bi bi-chevron-down"></i>
        </div>
      </div>
      <div class="consultorio-select-wrapper">
        <select class="consultorio-select" [value]="consultorio()" (change)="onConsultorio($event)">
          @for (c of consultorios; track c) {
          <option [value]="c">{{ c }}</option>
          }
        </select>
        <span class="consultorio-current">{{ consultorio() }}</span>
      </div>
    </div>
    <div class="consultorio-mini">consultorio {{ consultorio().match(/\d+/)?.[0] ?? '1' }}</div>

    <!-- Navegación: CONSULTA -->
    <div class="menu-section">
      <span class="section-label">CONSULTA</span>
      <app-nav-list [items]="consulta" (navegar)="close()" />
    </div>

    <!-- Navegación: PERFIL -->
    <div class="menu-section">
      <span class="section-label">PERFIL</span>
      <app-nav-list [items]="perfil" (navegar)="close()" />
    </div>
  </div>

  <!-- Footer con datos del usuario y Cerrar Sesión -->
  <div class="sidebar-footer">
    <div class="user-card d-flex align-items-center gap-3">
      <div class="avatar-container">
        <img src="assets/images/avatar_2.svg" alt="Avatar Médico" class="avatar-img" />
      </div>
      <div class="user-info">
        <span class="user-prefix">Dr(a).</span>
        <strong class="user-name d-block">Nombre</strong>
        <span class="user-role d-block">Especialidad</span>
      </div>
    </div>

    <div class="user-email">nombre@correo.com.mx</div>

    <button type="button" class="btn-logout" (click)="onLogout()" title="Cerrar sesión">
      <i class="bi bi-person-circle"></i>
      <span class="txt">CERRAR SESIÓN</span>
    </button>
  </div>

</aside>
